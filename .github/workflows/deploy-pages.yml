name: Deploy NekoCast to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages e na branch gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Instalar Dependências do Site
        run: |
          cd site
          npm ci

      - name: Compilar Site (React + Vite Serverless)
        run: |
          cd site
          npm run build

      # 1. Publica na branch gh-pages (compatível com "Deploy from a branch")
      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist

      # 2. Publica via GitHub Actions oficial (compatível com "GitHub Actions")
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Enviar Artefato
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: 'site/dist'

      - name: Publicar no GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
