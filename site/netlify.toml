# Configuração de suporte para deploy quando Base Directory = site
[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/app/*"
  to = "/app/:splat"
  status = 200

[[redirects]]
  from = "/api/jikan/*"
  to = "https://api.jikan.moe/v4/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/mangadex/*"
  to = "https://api.mangadex.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
